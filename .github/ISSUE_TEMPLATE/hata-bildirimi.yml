name: Bug report / Hata bildirimi
description: Something failed during install or generation
body:
  - type: input
    id: gpu
    attributes:
      label: "GPU, driver, RAM / Ekran karti, surucu, RAM"
      placeholder: "GTX 1050 Ti 4 GB, driver 581, 16 GB"
    validations:
      required: true
  - type: input
    id: komut
    attributes:
      label: "Command and frame count / Komut ve kare sayisi"
    validations:
      required: true
  - type: input
    id: hata-kodu
    attributes:
      label: "Error code / Hata kodu (example / ornek: VT-E-DISK)"
      description: "Our scripts print lines like `HATA: [VT-E-...]` or `UYARI: [VT-W-...]`. Paste the code; see docs/SIK_HATALAR.md. No code? Paste the first 20 lines of the script output below. / Betiklerimiz `HATA: [VT-E-...]` gibi satirlar basar. Kodu yazin (docs/SIK_HATALAR.md). Kod yoksa betik ciktisinin ilk 20 satirini asagiya yapistirin."
      placeholder: "VT-E-DISK"
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: "Last lines of the log / Gunlugun son satirlari (no personal paths please)"
    validations:
      required: true
  - type: textarea
    id: tani
    attributes:
      label: "Diagnosis report (optional) / Tani raporu (istege bagli)"
      description: "Run `tani.cmd` and paste the content of `tani_raporu.txt`. It sends nothing; read it first, the privacy filter is a rough pattern, not a guarantee. / `tani.cmd` calistirin, `tani_raporu.txt` icerigini yapistirin. Hicbir sey gondermez; once okuyun, gizlilik suzgeci kaba bir desendir, garanti degildir."
      render: text
    validations:
      required: false
  - type: textarea
    id: beklenen
    attributes:
      label: "Expected vs what happened / Beklenen ve olan"
